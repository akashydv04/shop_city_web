name: web-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify API adapter contracts
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Verify development build
        run: npm run build:dev
      - name: Verify dedicated local modes
        run: |
          npx vite build --mode demo
          npx vite build --mode api
